name: GitHub Actions CI

on:
  push:
    branches:
      - master
      - practice/ci-failure
  pull_request:
    branches:
      - master

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "GitHub Actions CI started"
          test -f .gitignore
          echo ".gitignore file exists"

      - name: Simulate CI failure
        run: exit 1